<!DOCTYPE html>
<html lang="en">
<head>
  <!-- This part sets the page information and styles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Coffee House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- This link helps keyboard users go to the main content. -->
  <a class="skip" href="#main">Skip to main content</a>

  <!-- The header has the logo and the main navigation. -->
  <header class="header">
    <div class="container header-content">
      <a class="logo" href="index.html">
        <img src="images/my-coffee-shop-logo.svg" alt="My Coffee House">
      </a>
      <nav class="navigation" aria-label="Main navigation">
        <ul class="menu">
          <li><a href="#about">About Us</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#locations">Locations</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Page content goes inside this main area. -->
  <main id="main">
    <!-- This is the main banner with a link to the menu. -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-content">
        <h1 id="hero-title" class="hero-title">Experience coffee like never before</h1>
        <p class="hero-text">We craft more than beverages; we curate memories, one flavorful moment at a time. Embrace the aroma and let every visit be a chapter in your coffee story.</p>
        <a class="btn btn-primary" href="#menu">Explore our menu</a>
      </div>
    </section>
  </main>
</body>
</html>
